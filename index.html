<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AtölyePro">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#161311">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>🔧 AtölyePro — Egzoz, Chiptuning & El Arabası Üretim Yönetimi</title>
<style>
:root{
  --bg:#161311; --surface:#1e1a17; --card:#252019; --border:#3a322a;
  --ember:#e8622c; --ember-dim:#e8622c22; --steel:#7a8a94;
  --white:#f5f1ec; --text:#d8d0c6; --muted:#8f8578;
  --green:#5fb87a; --red:#e15c5c; --yellow:#d9a441; --blue:#5b8fc9;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
input,select,textarea{font-family:inherit;}
.fp-fade{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.fp-card:hover{border-color:#4a4038;}
button{font-family:inherit;}

/* ===== Responsive: tablet ===== */
@media (max-width:1024px){
  .fp-sidebar{width:180px !important;}
  .fp-main{padding:20px !important;}
}

/* ===== Responsive: telefon ===== */
@media (max-width:680px){
  .fp-app{flex-direction:column !important;}
  .fp-sidebar{
    width:100% !important;
    flex-direction:row !important;
    align-items:center !important;
    position:fixed !important;
    left:0; right:0; bottom:0; top:auto !important;
    height:auto !important;
    z-index:500;
    padding:6px 4px !important;
    border-right:none !important;
    border-top:1px solid var(--border);
    background:var(--surface);
  }
  .fp-sidebar-brand,.fp-sidebar-footer,.fp-sidebar-spacer{display:none !important;}
  .fp-navlist{
    display:flex !important;
    flex-direction:row !important;
    gap:2px !important;
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .fp-navitem{
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
    gap:2px !important;
    flex-shrink:0;
    min-width:60px;
    text-align:center;
    padding:6px 4px !important;
    margin-bottom:0 !important;
    border-radius:8px !important;
  }
  .fp-navicon{font-size:17px;}
  .fp-navlabel{font-size:9px;line-height:1.1;white-space:nowrap;}
  .fp-main{
    padding:14px 12px 88px !important;
    max-width:100% !important;
  }
  .fp-grid2{grid-template-columns:1fr !important;}

  /* Modallar telefonda alttan açılan tam genişlikte panel olsun,
     ve her zaman alt gezinme çubuğunun ÜSTÜNDE görünsün. */
  .fp-modal-overlay{align-items:flex-end !important; padding:0 !important;}
  .fp-mbox{
    width:100% !important;
    max-width:100% !important;
    max-height:85vh !important;
    border-radius:16px 16px 0 0 !important;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)) !important;
  }
}

/* Tabloların dar ekranlarda taşmaması */
table{min-width:520px;}

/* Masaüstünde tablo, telefonda kart listesi */
.fp-liste-mobil{display:none;}
@media (max-width:680px){
  .fp-liste-masaustu{display:none !important;}
  .fp-liste-mobil{display:flex !important;}
}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
