<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AS Yönetim">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <title>AS — Egzoz, Chiptuning & El Arabası Üretim Yönetimi</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1c1c1c;
            --border-color: #2a2a2a;
            --accent: #e8772e;
            --accent-hover: #f08a46;
            --accent-dim: #e8772e22;
            --text-primary: #f0ece6;
            --text-secondary: #b0a8a0;
            --text-muted: #6f6a64;
            --green: #5cb87a;
            --red: #d95353;
            --yellow: #d9a441;
            --blue: #5b8fc9;
            --purple: #a87fd0;
            --radius: 10px;
            --shadow: 0 6px 20px rgba(0,0,0,0.7);
            --transition: all 0.2s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 8px; }
        input, select, textarea {
            font-family: inherit;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius);
            padding: 12px 14px;
            font-size: 0.9rem;
            width: 100%;
            transition: var(--transition);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: var(--text-primary); transition: var(--transition); }
        .fp-fade { animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .text-accent { color: var(--accent); }
        .text-muted { color: var(--text-muted); }
        .bg-accent { background: var(--accent); color: #0a0a0a; }
        .card-hover { transition: var(--transition); }
        .card-hover:hover { border-color: #3d3d3d; transform: translateY(-2px); box-shadow: var(--shadow); }
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .module-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            transition: var(--transition);
            cursor: pointer;
        }
        .module-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }
        .module-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }
        .module-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .module-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .module-badge {
            display: inline-block;
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 10px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 20px;
            border-top: 3px solid var(--accent);
        }
        .stat-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .btn-primary {
            background: var(--accent);
            color: #0a0a0a;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 13px;
            transition: var(--transition);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 9px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            transition: var(--transition);
        }
        .btn-outline:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }
        .btn-danger {
            background: transparent;
            color: var(--red);
            border: 1px solid var(--red);
            padding: 7px 14px;
            border-radius: var(--radius);
            font-size: 12px;
            transition: var(--transition);
        }
        .btn-danger:hover {
            background: var(--red);
            color: #0a0a0a;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-green { background: var(--green)22; color: var(--green); }
        .badge-yellow { background: var(--yellow)22; color: var(--yellow); }
        .badge-red { background: var(--red)22; color: var(--red); }
        .badge-blue { background: var(--blue)22; color: var(--blue); }
        .badge-purple { background: var(--purple)22; color: var(--purple); }
        .badge-accent { background: var(--accent-dim); color: var(--accent); }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .flex-gap { display: flex; gap: 8px; flex-wrap: wrap; }
        .mb-16 { margin-bottom: 16px; }
        .mb-20 { margin-bottom: 20px; }
        .mt-8 { margin-top: 8px; }
        .w-full { width: 100%; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        th { text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); }
        td { padding: 12px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-secondary); }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 28px;
            max-height: 90vh;
            overflow-y: auto;
            width: min(600px, 96vw);
            box-shadow: var(--shadow);
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
        }
        .sidebar {
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
        }
        .main-content {
            flex: 1;
            padding: 24px 32px;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13.5px;
            color: var(--text-muted);
            transition: var(--transition);
            margin-bottom: 2px;
            border: 1px solid transparent;
        }
        .nav-item:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .nav-item.active {
            background: var(--accent-dim);
            color: var(--text-primary);
            border-color: var(--accent);
            font-weight: 600;
        }
        .nav-icon { font-size: 18px; width: 28px; text-align: center; }
        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .section-sub {
            font-size: 13px;
            color: var(--text-muted);
        }
        @media (max-width: 768px) {
            .sidebar { width: 60px; padding: 12px 8px; }
            .sidebar .nav-label { display: none; }
            .sidebar .brand-text { display: none; }
            .main-content { padding: 16px; }
            .grid-2 { grid-template-columns: 1fr; }
            .stat-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

<script>
const { useState, useEffect } = React;
const RC = window.Recharts || {};
const { LineChart, Line, BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend } = RC;

// --- Sabitler ---
const C = {
    bg: "#0a0a0a", surface: "#141414", card: "#1c1c1c", border: "#2a2a2a",
    accent: "#e8772e", accentHover: "#f08a46", white: "#f0ece6", text: "#b0a8a0",
    muted: "#6f6a64", green: "#5cb87a", red: "#d95353", yellow: "#d9a441",
    blue: "#5b8fc9", purple: "#a87fd0"
};

const HIZMET_TIP_LABEL = {
    egzoz_tamir: "🔧 Egzoz Tamiri",
    egzoz_degisim: "🔩 Egzoz Değişimi",
    egr_partikul: "🌫️ EGR & Partikül",
    chiptuning: "⚡ Chiptuning"
};

const EL_ARABASI_TIP_LABEL = {
    kantarli: "⚖️ Kantarlı El Arabası",
    kantarsiz: "🛒 Kantarsız El Arabası"
};

const DURUM_LABEL = { bekliyor: "Bekliyor", devam: "Devam Ediyor", tamamlandi: "Tamamlandı", iptal: "İptal" };
const DURUM_RENK = { bekliyor: C.yellow, devam: C.blue, tamamlandi: C.green, iptal: C.red };

const LS = {
    get: (k, d = []) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => { if (!d) return "—"; const [y, m, g] = d.split("-"); return g ? `${g}.${m}.${y}` : d; };
const fmtTL = (n) => `₺${(+n || 0).toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;

const DEFAULT_SETTINGS = {
    firmaAdi: "AS Egzoz & Chiptuning",
    firmaAdres: "Manisa Organize Sanayi Bölgesi",
    firmaTel: "+90 555 123 45 67",
    kdvOrani: 20,
    kantarliFiyat: 4800,
    kantarsizFiyat: 3500
};

const getSettings = () => ({ ...DEFAULT_SETTINGS, ...LS.get("ayarlar", {}) });
const saveSettings = (s) => LS.set("ayarlar", s);

function seedVeri() {
    if (localStorage.getItem("as_seed_v2")) return;
    LS.set("cariler", [
        { id: "c1", ad: "Mehmet Yılmaz", tel: "0532 111 22 33", adres: "Akhisar, Manisa" },
        { id: "c2", ad: "Kaya Nakliyat Ltd.", tel: "0533 222 33 44", adres: "Salihli, Manisa" },
        { id: "c3", ad: "Öztürk Tarım", tel: "0534 333 44 55", adres: "Turgutlu, Manisa" }
    ]);
    LS.set("servisIsleri", [
        { id: "s1", tarih: today(), musteriId: "c1", aracPlaka: "45 ABC 123", aracModel: "Ford Transit", hizmetTuru: "egzoz_degisim", aciklama: "Arka egzoz komple değişim", tutar: 3800, durum: "tamamlandi", odendi: true },
        { id: "s2", tarih: today(), musteriId: "c2", aracPlaka: "35 XYZ 456", aracModel: "Mercedes Actros", hizmetTuru: "chiptuning", aciklama: "Stage 1 chiptuning + EGR off", tutar: 9500, durum: "devam", odendi: false },
        { id: "s3", tarih: today(), musteriId: "c3", aracPlaka: "45 DEF 789", aracModel: "Fiat Doblo", hizmetTuru: "egr_partikul", aciklama: "EGR valf temizliği", tutar: 2200, durum: "bekliyor", odendi: false }
    ]);
    LS.set("uretimKayitlari", [
        { id: "u1", tarih: today(), tip: "kantarli", adet: 8, aciklama: "Haftalık üretim" },
        { id: "u2", tarih: today(), tip: "kantarsiz", adet: 12, aciklama: "Haftalık üretim" }
    ]);
    LS.set("satislar", []);
    LS.set("stokHareketleri", []);
    LS.set("personeller", [
        { id: "p1", ad: "Ali Usta", unvan: "Egzoz Uzmanı", maas: 18000, iseBaslama: "2023-01-15" },
        { id: "p2", ad: "Caner Tekin", unvan: "Chiptuning Uzmanı", maas: 22000, iseBaslama: "2022-06-01" }
    ]);
    LS.set("tedarikciler", [
        { id: "t1", ad: "Egzoz Malzeme Ltd.", tel: "0535 111 22 33", adres: "İzmir" },
        { id: "t2", ad: "Yedek Parça Merkezi", tel: "0536 222 33 44", adres: "Manisa" }
    ]);
    LS.set("giderler", [
        { id: "g1", tarih: today(), kategori: "kira", aciklama: "Atölye kirası", tutar: 5000 },
        { id: "g2", tarih: today(), kategori: "elektrik", aciklama: "Elektrik faturası", tutar: 1200 }
    ]);
    localStorage.setItem("as_seed_v2", "1");
}

// --- Bileşenler ---
function Badge({ d, map = DURUM_LABEL, renk = DURUM_RENK }) {
    const colorMap = { bekliyor: "yellow", devam: "blue", tamamlandi: "green", iptal: "red" };
    const cls = `badge-${colorMap[d] || 'accent'}`;
    return React.createElement("span", { className: `badge ${cls}` }, map[d] || d);
}

function Modal({ title, onClose, children }) {
    return React.createElement("div", { className: "modal-overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
        React.createElement("div", { className: "modal-box" },
            React.createElement("div", { className: "modal-title" }, title),
            children,
            React.createElement("div", { className: "flex-gap", style: { marginTop: 20, justifyContent: "flex-end" } },
                React.createElement("button", { className: "btn-outline", onClick: onClose }, "İptal"),
                React.createElement("button", { className: "btn-primary", onClick: onClose }, "Kapat")
            )
        )
    );
}

function cariAd(cariler, id) { return (cariler.find(c => c.id === id) || {}).ad || "—"; }

// --- Modül Kartı ---
function ModuleCard({ icon, title, desc, badge, onClick }) {
    return React.createElement("div", { className: "module-card", onClick: onClick },
        React.createElement("span", { className: "module-icon" }, icon),
        React.createElement("div", { className: "module-title" }, title),
        React.createElement("div", { className: "module-desc" }, desc),
        badge && React.createElement("span", { className: "module-badge" }, badge)
    );
}

function StatCard({ color, value, label, sub }) {
    return React.createElement("div", { className: "stat-card", style: { borderTopColor: color || C.accent } },
        React.createElement("div", { className: "stat-value" }, value),
        React.createElement("div", { className: "stat-label" }, label),
        sub && React.createElement("div", { className: "stat-sub" }, sub)
    );
}

// --- Ana Sayfa: Dashboard (Modül Paneli) ---
function Dashboard({ setPage }) {
    const [servisler] = useState(LS.get("servisIsleri"));
    const [uretim] = useState(LS.get("uretimKayitlari"));
    const [satislar] = useState(LS.get("satislar"));
    const [personeller] = useState(LS.get("personeller"));
    const [giderler] = useState(LS.get("giderler"));

    const acikServis = servisler.filter(s => s.durum !== "tamamlandi" && s.durum !== "iptal").length;
    const buAyGelir = servisler.filter(s => s.tarih && s.tarih.startsWith(today().slice(0,7)) && s.durum === "tamamlandi").reduce((t,s) => t + (+s.tutar || 0), 0)
        + satislar.filter(s => s.tarih && s.tarih.startsWith(today().slice(0,7))).reduce((t,s) => t + (+s.toplam || 0), 0);
    const buAyGider = giderler.filter(g => g.tarih && g.tarih.startsWith(today().slice(0,7))).reduce((t,g) => t + (+g.tutar || 0), 0);
    const personelSayisi = personeller.length;

    const stokHesapla = (tip) => uretim.filter(u => u.tip === tip).reduce((t,u) => t + (+u.adet || 0), 0)
        - satislar.filter(s => s.tip === tip).reduce((t,s) => t + (+s.adet || 0), 0);
    const toplamStok = stokHesapla("kantarli") + stokHesapla("kantarsiz");

    const moduller = [
        { id: "servis", icon: "🔧", title: "Servis İşlemleri", desc: "Egzoz, EGR, partikül ve chiptuning servis takibi", badge: `${acikServis} açık iş` },
        { id: "uretim", icon: "🏭", title: "Üretim & Stok", desc: "El arabası üretim girişi, stok yönetimi ve satış", badge: `${toplamStok} adet stok` },
        { id: "cari", icon: "👥", title: "Müşteri Yönetimi", desc: "Müşteri ekleme, düzenleme ve işlem geçmişi" },
        { id: "personel", icon: "👨‍🔧", title: "Personel Takibi", desc: "Personel bilgileri, maaş ve performans" },
        { id: "tedarikci", icon: "📦", title: "Tedarikçiler", desc: "Tedarikçi yönetimi ve iletişim bilgileri" },
        { id: "muhasebe", icon: "💰", title: "Muhasebe & Rapor", desc: "Gelir-gider, kâr-zarar ve detaylı raporlar" },
        { id: "gider", icon: "💳", title: "Gider Takibi", desc: "Kira, elektrik, malzeme giderlerini kaydet" },
        { id: "ayarlar", icon: "⚙️", title: "Ayarlar", desc: "Firma bilgileri, fiyatlar ve veri yönetimi" }
    ];

    return React.createElement("div", { className: "fp-fade" },
        React.createElement("div", { className: "flex-between mb-16" },
            React.createElement("div", null,
                React.createElement("div", { className: "section-title" }, "📊 Genel Bakış"),
                React.createElement("div", { className: "section-sub" }, "AS — Egzoz, Chiptuning & El Arabası Üretim Yönetimi")
            ),
            React.createElement("div", null,
                React.createElement("span", { className: "text-muted", style: { fontSize: 13 } }, new Date().toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))
            )
        ),
        React.createElement("div", { className: "stat-grid" },
            React.createElement(StatCard, { color: C.accent, value: acikServis, label: "Açık Servis İşi" }),
            React.createElement(StatCard, { color: C.green, value: fmtTL(buAyGelir), label: "Bu Ay Gelir" }),
            React.createElement(StatCard, { color: C.red, value: fmtTL(buAyGider), label: "Bu Ay Gider" }),
            React.createElement(StatCard, { color: C.blue, value: `${toplamStok} adet`, label: "Toplam Stok", sub: "Kantarlı + Kantarsız" }),
            React.createElement(StatCard, { color: C.purple, value: personelSayisi, label: "Personel Sayısı" }),
            React.createElement(StatCard, { color: C.yellow, value: fmtTL(buAyGelir - buAyGider), label: "Tahmini Net Kâr" })
        ),
        React.createElement("div", { className: "module-grid" },
            moduller.map(m =>
                React.createElement(ModuleCard, {
                    key: m.id,
                    icon: m.icon,
                    title: m.title,
                    desc: m.desc,
                    badge: m.badge,
                    onClick: () => setPage(m.id)
                })
            )
        )
    );
}

// --- Servis İşlemleri Modülü ---
function ServisModulu() {
    const [cariler, setCariler] = useState(LS.get("cariler"));
    const [liste, setListe] = useState(LS.get("servisIsleri"));
    const [modalAcik, setModalAcik] = useState(false);
    const [form, setForm] = useState({});
    const [hata, setHata] = useState("");
    const [durumFiltre, setDurumFiltre] = useState("tumu");

    const kaydet = () => {
        if (!form.musteriId) { setHata("Müşteri seçimi zorunludur."); return; }
        if (!(form.aracPlaka || "").trim()) { setHata("Araç plakası zorunludur."); return; }
        if (!form.hizmetTuru) { setHata("Hizmet türü seçimi zorunludur."); return; }
        if (!(+form.tutar > 0)) { setHata("Tutar 0'dan büyük olmalıdır."); return; }
        setHata("");
        const kayit = { ...form, id: form.id || uid(), tarih: form.tarih || today(), durum: form.durum || "bekliyor" };
        const yeni = form.id ? liste.map(x => x.id === form.id ? kayit : x) : [...liste, kayit];

function CariModulu() {
    const [liste, setListe] = useState(LS.get("cariler"));

    const [satislar] = useState(LS.get("satislar"));
    const [modalAcik, setModalAcik] = useState(false);
    const [form, setForm] = useState({});

    const kaydet = () => {
        if (!(form.ad || "").trim()) { alert("Müşteri adı zorunludur."); return; }
        const kayit = { ...form, id: form.id || uid() };
        const yeni = form.id ? liste.map(x => x.id === form.id ? kayit : x) : [...liste, kayit];
        LS.set("cariler", yeni);
        setListe(yeni);
        setModalAcik(false);

    const sil = (id) => {
        if (servisler.some(s => s.musteriId === id) || satislar.some(s => s.musteriId === id)) {
            alert("Bu müşteriye ait kayıtlar var, önce onları silin.");
            return;
        }

        const yeni = liste.filter(x => x.id !== id);
        LS.set("cariler", yeni);
        setListe(yeni);

            React.createElement("div", { style: { marginTop: 12 } },
                React.createElement("label", { className: "text-muted", style: { fontSize: 12, display: "block", marginBottom: 4 } }, "Adres"),
                React.createElement("input", { value: form.firmaAdres || "", onChange: (e) => setForm(f => ({ ...f, firmaAdres: e.target.value })) })
            )
        ),
        React.createElement("div", { style: { background: C.card, borderRadius: 10, border: `1px solid ${C.border}`, padding: 20, marginBottom: 16 } },
            React.createElement("div", { style: { fontWeight: 700, color: C.white, marginBottom: 12 } }, "🛒 El Arabası Varsayılan Fiyatlar"),
            React.createElement("div", { className: "grid-2" },
                React.createElement("div", null,
                    React.createElement("label", { className: "text-muted", style: { fontSize: 12, display: "block", marginBottom: 4 } }, "Kantarlı El Arabası (₺)"),
                    React.createElement("input", { type: "number", value: form.kantarliFiyat || "", onChange: (e) => setForm(f => ({ ...f, kantarliFiyat: +e.target.value })) })
                ),
                React.createElement("div", null,
                    React.createElement("label", { className: "text-muted", style: { fontSize: 12, display: "block", marginBottom: 4 } }, "Kantarsız El Arabası (₺)"),
                    React.createElement("input", { type: "number", value: form.kantarsizFiyat || "", onChange: (e) => setForm(f => ({ ...f, kantarsizFiyat: +e.target.value })) })
                )
            )
        ),
        React.createElement("div", { style: { background: C.card, borderRadius: 10, border: `1px solid ${C.border}`, padding: 20, marginBottom: 16 } },
            React.createElement("div", { style: { fontWeight: 700, color: C.white, marginBottom: 12 } }, "💾 Veri Yönetimi"),
            React.createElement("div", { style: { fontSize: 12, color: C.muted, marginBottom: 14 } }, "Tüm verileri yedekleyin veya geri yükleyin."),
            React.createElement("div", { className: "flex-gap" },
                React.createElement("button", { className: "btn-outline", onClick: () => {
                    const veri = {};
                    ["cariler","servisIsleri","uretimKayitlari","satislar","personeller","tedarikciler","giderler","ayarlar"].forEach(k => veri[k] = k === "ayarlar" ? getSettings() : LS.get(k));
                    const blob = new Blob([JSON.stringify(veri, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url; a.download = `as-yedek-${today()}.json`; a.click(); URL.revokeObjectURL(url);
                } }, "⬇️ Yedeği İndir"),
                React.createElement("label", { className: "btn-outline", style: { cursor: "pointer" } },
                    "⬆️ Yedek Yükle",
                    React.createElement("input", { type: "file", accept: ".json", style: { display: "none" }, onChange: (e) => {
                        const dosya = e.target.files[0];
                        if (!dosya) return;
                        const okuyucu = new FileReader();
                        okuyucu.onload = (ev) => {
                            try {
                                const veri = JSON.parse(ev.target.result);
                                Object.entries(veri).forEach(([k,v]) => k === "ayarlar" ? saveSettings(v) : LS.set(k, v));
                                alert("Yedek yüklendi. Sayfa yenilenecek.");
                                window.location.reload();
                            } catch (err) { alert("Dosya okunamadı: " + err.message); }
                        };
                        okuyucu.readAsText(dosya);
                    } })
                )
            )
        ),
        React.createElement("button", { className: "btn-primary", onClick: kaydet }, "💾 Ayarları Kaydet"),
        kaydedildi && React.createElement("span", { style: { marginLeft: 12, color: C.green, fontSize: 13 } }, "✓ Kaydedildi")
    );
}

// --- Sayfa Yönlendirme ---
function App() {
    seedVeri();
    const [page, setPage] = useState(() => location.hash.replace("#", "") || "dashboard");

    useEffect(() => { location.hash = page; }, [page]);

    const pageComponents = {
        dashboard: Dashboard,
        servis: ServisModulu,
        uretim: UretimModulu,
        cari: CariModulu,
        personel: PersonelModulu,
        tedarikci: TedarikciModulu,
        muhasebe: MuhasebeModulu,
        gider: GiderModulu,
        ayarlar: AyarlarModulu
    };

    const AktifPage = pageComponents[page] || Dashboard;
    const navItems = [
        { id: "dashboard", label: "Genel Bakış", icon: "📊" },
        { id: "servis", label: "Servis İşlemleri", icon: "🔧" },
        { id: "uretim", label: "Üretim & Stok", icon: "🏭" },
        { id: "cari", label: "Müşteriler", icon: "👥" },
        { id: "personel", label: "Personel", icon: "👨‍🔧" },
        { id: "tedarikci", label: "Tedarikçiler", icon: "📦" },
        { id: "muhasebe", label: "Muhasebe", icon: "💰" },
        { id: "gider", label: "Gider Takibi", icon: "💳" },
        { id: "ayarlar", label: "Ayarlar", icon: "⚙️" }
    ];

    return React.createElement("div", { className: "app-layout" },
        React.createElement("div", { className: "sidebar" },
            React.createElement("div", { style: { padding: "0 4px 20px" } },
                React.createElement("div", { style: { fontSize: 18, fontWeight: 800, color: C.white, letterSpacing: -0.3 } }, "🔧 AS"),
                React.createElement("div", { className: "brand-text", style: { fontSize: 11, color: C.muted } }, "Yönetim Paneli")
            ),
            navItems.map(item =>
                React.createElement("div", {
                    key: item.id,
                    className: `nav-item ${page === item.id ? 'active' : ''}`,
                    onClick: () => setPage(item.id)
                },
                    React.createElement("span", { className: "nav-icon" }, item.icon),
                    React.createElement("span", { className: "nav-label" }, item.label)
                )
            ),
            React.createElement("div", { style: { flex: 1 } }),
            React.createElement("div", { style: { padding: "12px 4px", fontSize: 10.5, color: C.muted, borderTop: `1px solid ${C.border}`, marginTop: 12 } },
                "AS v1.0 · Yerel Veri"
            )
        ),
        React.createElement("div", { className: "main-content" },
            React.createElement(AktifPage, { setPage: setPage })
        )
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
</body>
