<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔧 AtölyePro — Egzoz, Chiptuning & El Arabası Üretim Yönetimi</title>
<style>
:root{
  --bg:#161311; --surface:#1e1a17; --card:#252019; --border:#3a322a;
  --ember:#e8622c; --ember-dim:#e8622c22; --steel:#7a8a94;
  --white:#f5f1ec; --text:#d8d0c6; --muted:#8f8578;
  --green:#5fb87a; --red:#e15c5c; --yellow:#d9a441; --blue:#5b8fc9;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
input,select,textarea{font-family:inherit;}
.fp-fade{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.fp-card:hover{border-color:#4a4038;}
button{font-family:inherit;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script src="app.js"></script>
</body>
