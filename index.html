    <style>
        :root {
            --bg: #0b0a08;
            --surface: #141210;
            --card: #1c1916;
            --border: #2f2a24;
            --accent: #d97731;
            --accent-dim: #d9773122;
            --steel: #7d8a94;
            --white: #f2ede7;
            --text: #cec6bc;
            --muted: #8f857a;
            --green: #6fbf8a;
            --red: #d95353;
            --yellow: #d9a441;
            --blue: #5f8fc9;
            --purple: #a87fd0;
            --radius: 12px;
            --shadow: 0 4px 16px rgba(0,0,0,0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

        button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: var(--text); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .card-hover:hover { border-color: #4a4038; }
        .text-accent { color: var(--accent); }
        .text-muted { color: var(--muted); }
        .bg-accent { background: var(--accent); color: #0b0a08; }
    </style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

<script>
const { useState, useEffect, useMemo, useRef } = React;
const RC = window.Recharts || {};
const { LineChart, Line, BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend } = RC;

// --- Sabitler & Stiller ---
const C = {

    accent: "#d97731", steel: "#7d8a94", white: "#f2ede7", text: "#cec6bc",
    muted: "#8f857a", green: "#6fbf8a", red: "#d95353", yellow: "#d9a441",
    blue: "#5f8fc9", purple: "#a87fd0"
};

const HIZMET_TIP_LABEL = {

    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => { if (!d) return "—"; const [y, m, g] = d.split("-"); return g ? `${g}.${m}.${y}` : d; };

const DEFAULT_SETTINGS = {
    firmaAdi: "AS Egzoz & Chiptuning",

    kdvOrani: 20,
    kantarliFiyat: 4800,
    kantarsizFiyat: 3500

const getSettings = () => ({ ...DEFAULT_SETTINGS, ...LS.get("ayarlar", {}) });
const saveSettings = (s) => LS.set("ayarlar", s);

// --- Örnek Veri (seed) ---
function seedVeri() {
    if (localStorage.getItem("as_seed_v1")) return;
    LS.set("cariler", [
        { id: "c1", ad: "Mehmet Yılmaz", tel: "0532 111 22 33", adres: "Akhisar, Manisa" },
        { id: "c2", ad: "Kaya Nakliyat Ltd.", tel: "0533 222 33 44", adres: "Salihli, Manisa" },
        { id: "c3", ad: "Öztürk Tarım", tel: "0534 333 44 55", adres: "Turgutlu, Manisa" }

        { id: "s3", tarih: today(), musteriId: "c3", aracPlaka: "45 DEF 789", aracModel: "Fiat Doblo", hizmetTuru: "egr_partikul", aciklama: "EGR valf temizliği ve partikül filtresi rejenerasyon", tutar: 2200, durum: "bekliyor", odendi: false }

// --- Stil Nesneleri (S) ---
const S = {
    app: { display: "flex", minHeight: "100vh" },
    sidebar: { width: 220, background: C.surface, borderRight: `1px solid ${C.border}`, display: "flex", flexDirection: "column", padding: "20px 14px", flexShrink: 0 },

    navBtn: (active) => ({ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13.5, marginBottom: 4, color: active ? C.white : C.muted, background: active ? C.accent + "22" : "transparent", border: active ? `1px solid ${C.accent}55` : "1px solid transparent", fontWeight: active ? 600 : 400 }),
    btn: (bg = C.accent) => ({ background: bg, color: "#0b0a08", border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 13, fontWeight: 700, cursor: "pointer", transition: "opacity 0.2s" }),
    btnO: { background: "transparent", color: C.text, border: `1px solid ${C.border}`, borderRadius: 8, padding: "9px 16px", fontSize: 13, cursor: "pointer" },
    btnR: { background: "transparent", color: C.red, border: `1px solid ${C.red}55`, borderRadius: 8, padding: "7px 12px", fontSize: 12, cursor: "pointer" },

// --- Bileşenler ---

    return React.createElement("div", { style: { marginBottom: 16 } },
        React.createElement("label", { style: { display: "block", fontSize: 12, color: C.muted, marginBottom: 5, fontWeight: 500 } }, label),
        children

}

function StatCard({ color, value, label, sub, icon }) {
    return React.createElement("div", { style: { ...S.card, marginBottom: 0, borderTop: `3px solid ${color}`, padding: "18px 18px 14px" } },
        React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start" } },
            React.createElement("div", null,
                React.createElement("div", { style: { fontSize: 24, fontWeight: 800, color: C.white, lineHeight: 1.2 } }, value),
                React.createElement("div", { style: { fontSize: 12, color: C.muted, marginTop: 4 } }, label),
                sub && React.createElement("div", { style: { fontSize: 11, color: C.muted, marginTop: 2 } }, sub)

            icon && React.createElement("div", { style: { fontSize: 28, opacity: 0.7 } }, icon)

function Badge({ d, map = DURUM_LABEL, renk = DURUM_RENK }) {

}

function Modal({ title, onClose, width = 520, children }) {
    return React.createElement("div", { style: S.modal, onClick: (e) => e.target === e.currentTarget && onClose() },
        React.createElement("div", { style: { ...S.mbox, width: `min(${width}px,94vw)` } },
            React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 } },
                React.createElement("div", { style: { fontSize: 18, fontWeight: 700, color: C.white } }, title),
                React.createElement("button", { onClick: onClose, style: { color: C.muted, fontSize: 22 } }, "✕")

            children

}

function Grid2({ children }) { return React.createElement("div", { style: S.grid2 }, children); }
function Grid4({ children }) { return React.createElement("div", { style: S.grid4 }, children); }

function TabBar({ tabs, active, onChange }) {
    return React.createElement("div", { style: { display: "flex", gap: 6, marginBottom: 18, flexWrap: "wrap" } },
        tabs.map(([k, l]) =>
            React.createElement("button", { key: k, onClick: () => onChange(k), style: { ...S.btn(active === k ? C.accent : "transparent"), color: active === k ? "#0b0a08" : C.muted, border: `1px solid ${active === k ? C.accent : C.border}`, padding: "8px 16px", fontWeight: active === k ? 700 : 400 } }, l)
        )
    );
}

function cariAd(cariler, id) { return (cariler.find(c => c.id === id) || {}).ad || "—"; }

// --- Sayfa Bileşenleri ---

function Dashboard() {
    const [servisler] = useState(LS.get("servisIsleri"));
    const [uretim] = useState(LS.get("uretimKayitlari"));
    const [satislar] = useState(LS.get("satislar"));
    const [cariler] = useState(LS.get("cariler"));

    const acikServisSayisi = servisler.filter(s => s.durum !== "tamamlandi" && s.durum !== "iptal").length;
    const buAyGelir = servisler.filter(s => s.tarih && s.tarih.startsWith(today().slice(0,7)) && s.durum === "tamamlandi").reduce((t,s) => t + (+s.tutar || 0), 0)
        + satislar.filter(s => s.tarih && s.tarih.startsWith(today().slice(0,7))).reduce((t,s) => t + (+s.toplam || 0), 0);
    const odenmemis = servisler.filter(s => !s.odendi && s.durum === "tamamlandi").reduce((t,s) => t + (+s.tutar || 0), 0);

    const stokHesapla = (tip) => uretim.filter(u => u.tip === tip).reduce((t,u) => t + (+u.adet || 0), 0)
        - satislar.filter(s => s.tip === tip).reduce((t,s) => t + (+s.adet || 0), 0);
    const kantarliStok = stokHesapla("kantarli");
    const kantarsizStok = stokHesapla("kantarsiz");

    const hizmetDagilimi = Object.entries(
        servisler.reduce((acc, s) => {
            const l = HIZMET_TIP_LABEL[s.hizmetTuru] || s.hizmetTuru;
            acc[l] = (acc[l] || 0) + 1;
            return acc;
        }, {})
    ).map(([name, value]) => ({ name, value }));
    const renkler = [C.accent, C.blue, C.green, C.yellow, C.purple];

    return React.createElement("div", { className: "fp-fade" },
        React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 } },
            React.createElement("div", { style: { fontSize: 22, fontWeight: 800, color: C.white } }, "📊 Genel Bakış"),
            React.createElement("div", { style: { fontSize: 13, color: C.muted } }, new Date().toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))
        ),
        React.createElement("div", { style: { fontSize: 13, color: C.muted, marginBottom: 20 } }, "AS — Egzoz, Chiptuning & El Arabası Üretim"),
        React.createElement(Grid4, null,
            React.createElement(StatCard, { color: C.accent, icon: "🔧", value: acikServisSayisi, label: "Açık Servis İşi" }),
            React.createElement(StatCard, { color: C.green, icon: "💰", value: fmtTL(buAyGelir), label: "Bu Ay Gelir" }),
            React.createElement(StatCard, { color: C.red, icon: "⏳", value: fmtTL(odenmemis), label: "Tahsil Edilecek" }),
            React.createElement(StatCard, { color: C.blue, icon: "🛒", value: `${kantarliStok + kantarsizStok} adet`, label: "Toplam El Arabası Stoku", sub: `${kantarliStok} kantarlı · ${kantarsizStok} kantarsız` })
        ),
        React.createElement(Grid2, null,
            React.createElement("div", { style: S.card },
                React.createElement("div", { style: S.secTitle }, "⚖️ Stok Durumu"),
                [["kantarli", kantarliStok], ["kantarsiz", kantarsizStok]].map(([tip, adet]) =>
                    React.createElement("div", { key: tip, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 16px", background: C.surface, borderRadius: 10, marginBottom: 8 } },
                        React.createElement("span", { style: { fontSize: 13, color: C.text } }, EL_ARABASI_TIP_LABEL[tip]),
                        React.createElement("span", { style: { fontSize: 18, fontWeight: 800, color: adet <= 3 ? C.red : C.white } }, adet, " adet")
                    )
                ),
                (kantarliStok <= 3 || kantarsizStok <= 3) &&
                React.createElement("div", { style: { marginTop: 12, padding: "10px 16px", background: C.red + "18", borderRadius: 8, fontSize: 12, color: C.red } }, "⚠️ Stok kritik seviyede — üretim planlamayı düşünün.")
            ),
            React.createElement("div", { style: S.card },
                React.createElement("div", { style: S.secTitle }, "📈 Hizmet Türü Dağılımı"),
                RC.PieChart && hizmetDagilimi.length > 0 ?
                    React.createElement(ResponsiveContainer, { width: "100%", height: 200 },
                        React.createElement(PieChart, null,
                            React.createElement(Pie, { data: hizmetDagilimi, dataKey: "value", nameKey: "name", cx: "50%", cy: "50%", innerRadius: 45, outerRadius: 78, paddingAngle: 2, label: ({ name, value }) => `${name}: ${value}` },
                                hizmetDagilimi.map((e, i) => React.createElement(Cell, { key: i, fill: renkler[i % renkler.length] }))
                            ),
                            React.createElement(Tooltip, { contentStyle: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 8 } })
                        )
                    ) :
                    React.createElement("div", { style: { color: C.muted, fontSize: 13 } }, "Henüz veri yok.")
            )
        ),
        React.createElement("div", { style: S.card },
            React.createElement("div", { style: S.secTitle }, "🕐 Son Servis İşleri"),
            servisler.length === 0 ?
                React.createElement("div", { style: { color: C.muted, fontSize: 13 } }, "Henüz kayıt yok.") :
                React.createElement("table", { style: S.tbl },
                    React.createElement("thead", null,
                        React.createElement("tr", null,
                            React.createElement("th", { style: S.th }, "Tarih"),
                            React.createElement("th", { style: S.th }, "Müşteri"),
                            React.createElement("th", { style: S.th }, "Araç"),
                            React.createElement("th", { style: S.th }, "Hizmet"),
                            React.createElement("th", { style: S.th }, "Tutar"),
                            React.createElement("th", { style: S.th }, "Durum")
                        )
                    ),
                    React.createElement("tbody", null,
                        [...servisler].sort((a,b) => (b.tarih || "").localeCompare(a.tarih || "")).slice(0,6).map(s =>
                            React.createElement("tr", { key: s.id },
                                React.createElement("td", { style: S.td }, fmtDate(s.tarih)),
                                React.createElement("td", { style: S.td }, cariAd(cariler, s.musteriId)),
                                React.createElement("td", { style: S.td }, s.aracPlaka),
                                React.createElement("td", { style: S.td }, HIZMET_TIP_LABEL[s.hizmetTuru]),
                                React.createElement("td", { style: S.td }, fmtTL(s.tutar)),
                                React.createElement("td", { style: S.td }, React.createElement(Badge, { d: s.durum }))
                            )
                        )
                    )
                )
        )
    );
}

function ServisIsleri() {
    const [cariler, setCariler] = useState(LS.get("cariler"));
    const [liste, setListe] = useState(LS.get("servisIsleri"));
    const [modalAcik, setModalAcik] = useState(false);
    const [form, setForm] = useState({});
    const [hata, setHata] = useState("");
    const [durumFiltre, setDurumFiltre] = useState("tumu");
    const [yeniCariAcik, setYeniCariAcik] = useState(false);

    const kaydet = () => {
        if (!form.musteriId) { setHata("Müşteri seçimi zorunludur."); return; }
        if (!(form.aracPlaka || "").trim()) { setHata("Araç plakası zorunludur."); return; }
        if (!form.hizmetTuru) { setHata("Hizmet türü seçimi zorunludur."); return; }
        if (!(+form.tutar > 0)) { setHata("Tutar 0'dan büyük olmalıdır."); return; }
        setHata("");
        const kayit = { ...form, id: form.id || uid(), tarih: form.tarih || today(), durum: form.durum || "bekliyor" };
        const yeni = form.id ? liste.map(x => x.id === form.id ? kayit : x) : [...liste, kayit];
        LS.set("servisIsleri", yeni);
        setListe(yeni);
        setModalAcik(false);
    };

    const sil = (id) => { if (!confirm("Bu servis kaydı silinsin mi?")) return; const yeni = liste.filter(x => x.id !== id); LS.set("servisIsleri", yeni); setListe(yeni); };
    const odendiIsaretle = (id) => { const yeni = liste.map(x => x.id === id ? { ...x, odendi: true } : x); LS.set("servisIsleri", yeni); setListe(yeni); };

    const gosterilecek = durumFiltre === "tumu" ? liste : liste.filter(s => s.durum === durumFiltre);

    return React.createElement("div", { className: "fp-fade" },
        React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 } },
            React.createElement("div", { style: { fontSize: 20, fontWeight: 800, color: C.white } }, "🔧 Servis İşleri"),
            React.createElement("button", { style: S.btn(), onClick: () => { setForm({ tarih: today(), durum: "bekliyor" }); setHata(""); setModalAcik(true); } }, "➕ Yeni Servis İşi")
        ),
        React.createElement(TabBar, { tabs: [["tumu","Tümü"],["bekliyor","Bekliyor"],["devam","Devam Ediyor"],["tamamlandi","Tamamlandı"]], active: durumFiltre, onChange: setDurumFiltre }),
        React.createElement("div", { style: S.card },
            React.createElement("table", { style: S.tbl },
                React.createElement("thead", null,
                    React.createElement("tr", null,
                        React.createElement("th", { style: S.th }, "Tarih"), React.createElement("th", { style: S.th }, "Müşteri"), React.createElement("th", { style: S.th }, "Araç"),
                        React.createElement("th", { style: S.th }, "Hizmet"), React.createElement("th", { style: S.th }, "Tutar"),
                        React.createElement("th", { style: S.th }, "Ödeme"), React.createElement("th", { style: S.th }, "Durum"), React.createElement("th", { style: S.th })
                    )
                ),
                React.createElement("tbody", null,
                    gosterilecek.length === 0 ? React.createElement("tr", null, React.createElement("td", { style: S.td, colSpan: 8 }, React.createElement("div", { style: { textAlign: "center", color: C.muted, padding: 20 } }, "Kayıt bulunamadı."))) :
                    [...gosterilecek].sort((a,b) => (b.tarih || "").localeCompare(a.tarih || "")).map(s =>
                        React.createElement("tr", { key: s.id },
                            React.createElement("td", { style: S.td }, fmtDate(s.tarih)),
                            React.createElement("td", { style: S.td }, React.createElement("strong", { style: { color: C.white } }, cariAd(cariler, s.musteriId))),
                            React.createElement("td", { style: S.td }, s.aracPlaka, s.aracModel ? ` · ${s.aracModel}` : ""),

        ...servisler.map(s => ({ id: s.id, tarih: s.tarih, musteriId: s.musteriId, aciklama: `${HIZMET_TIP_LABEL[s.hizmetTuru] || ""} — ${s.aracPlaka || ""}`, tutar: s.tutar, odendi: s.odendi, tur: "servis" })),
        ...satislar.map(s => ({ id: s.id, tarih: s.tarih, musteriId: s.musteriId, aciklama: `${EL_ARABASI_TIP_LABEL[s.tip] || ""} satışı (${s.adet} adet)`, tutar: s.toplam, odendi: true, tur: "satis" }))
    ].sort((a,b) => (b.tarih || "").localeCompare(a.tarih || ""));

    const toplamGelir = tumIslemler.reduce((t, i) => t + (+i.tutar || 0), 0);
    const tahsilEdilecek = tumIslemler.filter(i => !i.odendi).reduce((t, i) => t + (+i.tutar || 0), 0);
    const buAy = tumIslemler.filter(i => i.tarih && i.tarih.startsWith(today().slice(0,7))).reduce((t, i) => t + (+i.tutar || 0), 0);

    return React.createElement("div", { className: "fp-fade" },
        React.createElement("div", { style: { fontSize: 20, fontWeight: 800, color: C.white, marginBottom: 16 } }, "💰 Muhasebe Özeti"),
        React.createElement(Grid4, null,
            React.createElement(StatCard, { color: C.accent, icon: "💰", value: fmtTL(toplamGelir), label: "Toplam Gelir (Tüm Zamanlar)" }),
            React.createElement(StatCard, { color: C.green, icon: "📅", value: fmtTL(buAy), label: "Bu Ay Gelir" }),
            React.createElement(StatCard, { color: C.red, icon: "⏳", value: fmtTL(tahsilEdilecek), label: "Tahsil Edilecek" }),
            React.createElement(StatCard, { color: C.blue, icon: "🧾", value: tumIslemler.length, label: "Toplam İşlem Sayısı" })
        ),
        React.createElement("div", { style: S.card },
            React.createElement("div", { style: S.secTitle }, "Tüm İşlemler"),
            React.createElement("table", { style: S.tbl },
                React.createElement("thead", null,
                    React.createElement("tr", null,
                        React.createElement("th", { style: S.th }, "Tarih"), React.createElement("th", { style: S.th }, "Müşteri"),
                        React.createElement("th", { style: S.th }, "Açıklama"), React.createElement("th", { style: S.th }, "Tür"),
                        React.createElement("th", { style: S.th }, "Tutar"), React.createElement("th", { style: S.th }, "Durum")
                    )
                ),
                React.createElement("tbody", null,
                    tumIslemler.length === 0 ? React.createElement("tr", null, React.createElement("td", { style: S.td, colSpan: 6 }, React.createElement("div", { style: { textAlign: "center", color: C.muted, padding: 20 } }, "Kayıt yok."))) :
                    tumIslemler.map(i =>
                        React.createElement("tr", { key: i.tur + i.id },
                            React.createElement("td", { style: S.td }, fmtDate(i.tarih)),
                            React.createElement("td", { style: S.td }, React.createElement("strong", { style: { color: C.white } }, cariAd(cariler, i.musteriId))),
                            React.createElement("td", { style: S.td }, i.aciklama),
                            React.createElement("td", { style: S.td }, i.tur === "servis" ? "🔧 Servis" : "🛒 Satış"),
                            React.createElement("td", { style: S.td }, React.createElement("strong", { style: { color: C.accent } }, fmtTL(i.tutar))),
                            React.createElement("td", { style: S.td }, i.odendi ? React.createElement(Badge, { d: "tamamlandi", map: { tamamlandi: "Ödendi" }, renk: { tamamlandi: C.green } }) :
                                React.createElement(Badge, { d: "bekliyor", map: { bekliyor: "Bekliyor" }, renk: { bekliyor: C.yellow } }))
                        )
                    )
                )
            )
        )
    );
}

function Ayarlar() {
    const [form, setForm] = useState(getSettings());
    const [kaydedildi, setKaydedildi] = useState(false);
    const kaydet = () => { saveSettings(form); setKaydedildi(true); setTimeout(() => setKaydedildi(false), 2000); };

    return React.createElement("div", { className: "fp-fade" },
        React.createElement("div", { style: { fontSize: 20, fontWeight: 800, color: C.white, marginBottom: 16 } }, "⚙️ Ayarlar"),
        React.createElement("div", { style: S.card },
            React.createElement("div", { style: S.secTitle }, "🏢 Firma Bilgileri"),
            React.createElement(FG, { label: "Firma Adı" }, React.createElement("input", { style: { ...S.inp }, value: form.firmaAdi || "", onChange: (e) => setForm(f => ({ ...f, firmaAdi: e.target.value })) })),
            React.createElement(Grid2, null,
                React.createElement(FG, { label: "Telefon" }, React.createElement("input", { style: { ...S.inp }, value: form.firmaTel || "", onChange: (e) => setForm(f => ({ ...f, firmaTel: e.target.value })) })),
                React.createElement(FG, { label: "KDV Oranı (%)" }, React.createElement("input", { type: "number", style: { ...S.inp }, value: form.kdvOrani || "", onChange: (e) => setForm(f => ({ ...f, kdvOrani: +e.target.value })) }))
            ),
            React.createElement(FG, { label: "Adres" }, React.createElement("input", { style: { ...S.inp }, value: form.firmaAdres || "", onChange: (e) => setForm(f => ({ ...f, firmaAdres: e.target.value })) }))
        ),
        React.createElement("div", { style: S.card },
            React.createElement("div", { style: S.secTitle }, "🛒 El Arabası Varsayılan Fiyatlar"),
            React.createElement(Grid2, null,
                React.createElement(FG, { label: "Kantarlı El Arabası (₺)" }, React.createElement("input", { type: "number", style: { ...S.inp }, value: form.kantarliFiyat || "", onChange: (e) => setForm(f => ({ ...f, kantarliFiyat: +e.target.value })) })),
                React.createElement(FG, { label: "Kantarsız El Arabası (₺)" }, React.createElement("input", { type: "number", style: { ...S.inp }, value: form.kantarsizFiyat || "", onChange: (e) => setForm(f => ({ ...f, kantarsizFiyat: +e.target.value })) }))
            )
        ),
        React.createElement("div", { style: S.card },
            React.createElement("div", { style: S.secTitle }, "💾 Veri Yönetimi"),
            React.createElement("div", { style: { fontSize: 12, color: C.muted, marginBottom: 14 } }, "Tüm verilerinizi tek bir dosya olarak indirin veya geri yükleyin."),
            React.createElement("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
                React.createElement("button", { style: S.btnO, onClick: () => {
                    const veri = {};
                    ["cariler","servisIsleri","uretimKayitlari","satislar","ayarlar"].forEach(k => veri[k] = k === "ayarlar" ? getSettings() : LS.get(k));
                    const blob = new Blob([JSON.stringify(veri, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `as-yedek-${today()}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                } }, "⬇️ Yedeği İndir"),
                React.createElement("label", { style: { ...S.btnO, cursor: "pointer" } },
                    "⬆️ Yedek Yükle",
                    React.createElement("input", { type: "file", accept: ".json", style: { display: "none" }, onChange: (e) => {
                        const dosya = e.target.files[0];
                        if (!dosya) return;
                        const okuyucu = new FileReader();
                        okuyucu.onload = (ev) => {
                            try {
                                const veri = JSON.parse(ev.target.result);
                                Object.entries(veri).forEach(([k,v]) => k === "ayarlar" ? saveSettings(v) : LS.set(k, v));
                                alert("Yedek yüklendi. Sayfa yenilenecek.");
                                window.location.reload();
                            } catch (err) { alert("Dosya okunamadı: " + err.message); }
                        };
                        okuyucu.readAsText(dosya);
                    } })
                )
            )
        ),
        React.createElement("button", { style: S.btn(), onClick: kaydet }, "💾 Ayarları Kaydet"),
        kaydedildi && React.createElement("span", { style: { marginLeft: 12, color: C.green, fontSize: 13 } }, "✓ Kaydedildi")
    );
}

// --- Sayfa Tanımları ---
const SAYFALAR = [
    { id: "dashboard", label: "Genel Bakış", icon: "📊", comp: Dashboard },
    { id: "servis", label: "Servis İşleri", icon: "🔧", comp: ServisIsleri },
    { id: "uretim", label: "Üretim & Stok", icon: "🛒", comp: UretimStok },
    { id: "cariler", label: "Müşteriler", icon: "👥", comp: Cariler },
    { id: "muhasebe", label: "Muhasebe", icon: "💰", comp: Muhasebe },

];

    seedVeri();
    const [sayfa, setSayfa] = useState(() => location.hash.replace("#", "") || "dashboard");
    useEffect(() => { location.hash = sayfa; }, [sayfa]);

    const AktifBilesen = (SAYFALAR.find(s => s.id === sayfa) || SAYFALAR[0]).comp;

    return React.createElement("div", { style: S.app },
        React.createElement("div", { style: S.sidebar },
            React.createElement("div", { style: { padding: "6px 10px 20px" } },
                React.createElement("div", { style: { fontSize: 18, fontWeight: 800, color: C.white, letterSpacing: -0.3 } }, "🔧 AS"),
                React.createElement("div", { style: { fontSize: 11, color: C.muted, marginTop: 2 } }, "Egzoz · Chiptuning · Üretim")
            ),
            SAYFALAR.map(s =>
                React.createElement("div", { key: s.id, style: S.navBtn(sayfa === s.id), onClick: () => setSayfa(s.id) },
                    React.createElement("span", null, s.icon),
                    React.createElement("span", null, s.label)
                )
            ),
            React.createElement("div", { style: { flex: 1 } }),
            React.createElement("div", { style: { padding: "12px 10px", fontSize: 10.5, color: C.muted, borderTop: `1px solid ${C.border}`, marginTop: 12, paddingTop: 14 } },
                "AS Yönetim v1.0 · Yerel veri"
            )
        ),
        React.createElement("div", { style: S.main },
            React.createElement(AktifBilesen, null)
        )
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
